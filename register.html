<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>Alumni Management System</header>

<nav class="navbar">
    <div class="logo"></div>
</nav>

<section class="form-container">

    <h1>Alumni Registration</h1>

    <form>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label for="batch">Batch</label>
        <input type="number" id="batch" name="batch">

        <label for="department">Department</label>
        <select id="department" name="department">
            <option>Computer Science</option>
            <option>Software Engineering</option>
            <option>Artificial Intelligence</option>
            <option>Business Administration</option>
            <option>Accounting Finance</option>
            <option>Computer System Engineering</option>
            <option>Electrical Engineering</option>
            <option>Mathematics</option>
            <option>Education</option>
        </select>

        <label for="organization">Current Organization</label>
        <input type="text" id="organization" name="organization">

        <button type="submit">Register</button>

    </form>

    <p class="signin-text">Already have an account?</p>

    <a class="signin-link" href="login.html">Sign In</a>

</section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>Alumni Management System</header>

<nav class="navbar">
    <div class="logo"></div>
</nav>

<section class="form-container">

    <h1>Alumni Registration</h1>

    <form>

        <label>Full Name</label>
        <input type="text">

        <label>Email</label>
        <input type="email">

        <label>Batch</label>
        <input type="number">

        <label>Department</label>
        <select>
            <option>Computer Science</option>
            <option>Software Engineering</option>
            <option>Artifical Intelligence</option>
            <option>Business Administration</option>
            <option>Accounting Finance</option>
             <option>Computer System Engineering</option>
            <option>Electrical Engineering</option>
            <option>Mathematics</option>
            <option>Education</option>
        </select>

        <label>Current Organization</label>
        <input type="text">

        <button type="submit">Register</button>

    </form>

    <p class="signin-text">Already have an account?</p>

    <a class="signin-link" href="login.html">Sign In</a>

</section>

</body>
</html>
